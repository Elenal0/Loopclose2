name: loopclose

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-loopclose}
      POSTGRES_USER: ${DB_USER:-loopclose}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-loopclose_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-loopclose} -d $${POSTGRES_DB:-loopclose}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - loopclose_net

  app:
    build:
      context: .
      args:
        GIT_SHA: ${IMAGE_TAG:-}
    image: loopclose:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_NAME: ${APP_NAME:-LoopClose}
      DATABASE_URL: postgresql+psycopg://${DB_USER:-loopclose}:${DB_PASSWORD:-loopclose_secret}@db:5432/${DB_NAME:-loopclose}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GIT_SHA: ${IMAGE_TAG:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - loopclose_net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - loopclose_net

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - loopclose_net

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - loopclose_net

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  loopclose_net:
    driver: bridge

